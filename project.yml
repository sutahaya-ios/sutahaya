name: HayaosiApp
options:
  bundleIdPrefix: com.n
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

fileGroups:
  - Config/Subscription.storekit

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.8.0"

targets:
  HayaosiApp:
    type: application
    platform: iOS
    sources:
      - HayaosiApp
    # 署名(DEVELOPMENT_TEAM)は開発者ごとに違うため Config/local.xcconfig で与える(README参照)
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        # 共有の既定値は本番Bundle ID。共同開発者はgit管理外のlocal.xcconfigだけで上書きする
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # ホーム画面に出るアプリ名。ターゲット名・本番Bundle IDは変えない(要件 §10 #1)
        INFOPLIST_KEY_CFBundleDisplayName: スタはや
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 辞書・配列のキー(AdMobのアプリID・SKAdNetworkItems)は INFOPLIST_KEY_* で表現できないため、
        # 土台のplistを与える。単純な値は下の INFOPLIST_KEY_* 側にマージされる
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_NSUserTrackingUsageDescription: 広告をあなたの興味に合わせて表示するために使用します。許可しない場合も、広告の内容が変わるだけでアプリは通常どおり使えます。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  HayaosiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HayaosiApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  HayaosiApp:
    build:
      targets:
        HayaosiApp: all
        HayaosiAppTests: [test]
    test:
      config: Debug
      targets:
        - HayaosiAppTests
    run:
      config: Debug
      storeKitConfiguration: Config/Subscription.storekit
